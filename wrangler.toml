# Deployed by Cloudflare Workers Builds from the dashboard.
#
#   build command   bash scripts/build.sh
#   deploy command  npx wrangler deploy
#
# The Worker answers /api/contact and hands everything else to the static
# files that scripts/build.sh assembles into dist/.
#
# Two secrets are set in the dashboard, under *Runtime* variables and secrets —
# the Build section of the same page is a different store the Worker cannot read:
#   CONTACT_TO         the organiser the contact form is addressed to
#   CONTACT_CC         optional, a second organiser copied on every enquiry
# Adding a secret only creates a version; promote it under Deployments or it
# never reaches the running Worker.
# Must match the Worker that already exists in the dashboard, which is what
# Workers Builds is wired to. Renaming it here would deploy to a second,
# unconfigured Worker instead of updating this one. The name is not public:
# visitors arrive on the custom domain below.
name = "omiyacappella-site"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# The apex only. www is sent here by a dashboard redirect rule rather than a
# second custom domain, so the site answers on one hostname and search engines
# are never offered two copies of it.
#
# Keep this in step with SITE_URL in scripts/assemble.py: the canonical tags are
# built from that, and one pointing at a host the Worker does not answer on
# tells Google to index nothing.
routes = [
  { pattern = "omiyacappella.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Email Sending. The domain must be onboarded once:
#   npx wrangler email sending enable omiyacappella.com
[[send_email]]
name = "EMAIL"
