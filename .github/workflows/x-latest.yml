name: Fetch latest X posts

# Once a day, plus a manual button. The job writes assets/data/x-latest.json
# and the media beside it, then commits only when something actually changed.
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-latest
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      # x.com answers a headless browser with 403, so the script runs one with a
      # window. On a runner that means a virtual display; xvfb is preinstalled on
      # ubuntu-latest, and the browser's own libraries come from --with-deps.
      - name: Fetch
        id: fetch
        run: xvfb-run -a node scripts/fetch-x-latest.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets/data)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "Update the latest X posts"
          git push
