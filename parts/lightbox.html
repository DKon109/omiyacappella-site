<!-- ====================== LIGHTBOX ====================== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="画像の拡大表示" hidden>
  <button class="lightbox__close" type="button" id="lbClose" aria-label="閉じる">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" id="lbPrev" aria-label="前の画像">←</button>
  <button class="lightbox__nav lightbox__nav--next" type="button" id="lbNext" aria-label="次の画像">→</button>
  <figure class="lightbox__figure">
    <div class="lightbox__stage" id="lbStage"></div>
    <figcaption class="lightbox__cap" id="lbCap"></figcaption>
  </figure>
</div>
