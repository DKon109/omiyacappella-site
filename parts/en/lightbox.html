<!-- ====================== LIGHTBOX ====================== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged view" hidden>
  <button class="lightbox__close" type="button" id="lbClose" aria-label="Close">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" id="lbPrev" aria-label="Previous">←</button>
  <button class="lightbox__nav lightbox__nav--next" type="button" id="lbNext" aria-label="Next">→</button>
  <figure class="lightbox__figure">
    <div class="lightbox__stage" id="lbStage"></div>
    <figcaption class="lightbox__cap" id="lbCap"></figcaption>
  </figure>
</div>
